name: Build APK

# Every push builds a signed release APK and publishes it as a GitHub Release.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write # needed to create the release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Check that the catalog is up to date
        run: |
          python3 tools/build_catalog.py
          if ! git diff --quiet -- catalog/catalog.json app/src/main/assets/wallpapers; then
            echo "::warning::catalog/catalog.json or the bundled wallpapers were out of date. Run 'python3 tools/build_catalog.py' and commit the result so the app sees your changes."
          fi

      # Optional: sign with your own private key instead of the shared one in keystore/ (see README, "Signing").
      - name: Use private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk WallpaperSelector.apk

      - uses: actions/upload-artifact@v7
        with:
          name: WallpaperSelector-apk
          path: WallpaperSelector.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Builds of the default branch become the "latest" release; other branches are pre-releases.
          if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            kind="--latest"
          else
            kind="--prerelease"
          fi
          gh release create "v$VERSION_NAME" WallpaperSelector.apk \
            --target "$GITHUB_SHA" \
            --title "Wallpaper Selector $VERSION_NAME" \
            --notes "Built from \`${GITHUB_SHA::7}\` on \`${{ github.ref_name }}\`. Download **WallpaperSelector.apk** below and open it on your phone to install or update." \
            $kind
